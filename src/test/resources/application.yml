spring:
  datasource:
    url: jdbc:mysql://localhost:3306/eolala_test?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        dialect: org.hibernate.dialect.MySQLDialect

# OpenAI 설정
open-ai:
  google:
    url: http://localhost:8080
    path: /test
    key: test-key

# JWT 설정
jwt:
  secret-key: test-secret-key-for-testing-purposes-only-12345678901234567890
  access-token-expiration: 3600000
  refresh-token-expiration: 86400000

# Kakao OAuth 설정
kakao:
  client:
    id: test-client-id
    secret: test-client-secret
    redirect-uri: http://localhost:8080/callback

# 식품 API 설정
food:
  api:
    service-key: test-service-key
    base-url: http://localhost:8080